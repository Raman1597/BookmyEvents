<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tickets | BookMyEvents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <style>
        .time-slot { border: 1px solid #ddd; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .time-slot:hover, .time-slot.active { border-color: #F84464; color: #F84464; font-weight: bold; }
        .screen { background: #ddd; height: 10px; width: 70%; margin: 30px auto; border-radius: 50%; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .seat { width: 32px; height: 32px; border: 1px solid #198754; border-radius: 5px; margin: 3px; background: #fff; cursor: pointer; }
        .seat.selected { background: #198754; color: white; }
        .seat.sold { background: #e9ecef; border-color: #dee2e6; cursor: not-allowed; }
        .checkout-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 1000; padding: 15px 0; }
    </style>
</head>
<body class="bg-light pb-5">

    <nav class="navbar bg-dark navbar-dark py-3">
        <div class="container">
            <a class="navbar-brand fs-6" href="events.html"><i class="fa-solid fa-arrow-left"></i> All Movies</a>
            <span class="navbar-text text-white fw-bold fs-5 mx-auto" id="nav-movie-title">Loading...</span>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row bg-white p-4 rounded-4 shadow-sm border mb-4">
            <div class="col-md-3">
                <img id="movie-poster" src="" class="img-fluid rounded-4 shadow" alt="Movie Poster">
            </div>
            <div class="col-md-9 mt-3 mt-md-0">
                <h1 id="movie-title" class="fw-bold"></h1>
                <p id="movie-meta" class="text-muted fs-5 mb-3"></p>
                <hr>
                <h5 class="fw-bold">About the Movie</h5>
                <p id="movie-desc" class="text-secondary"></p>
            </div>
        </div>

        <div class="bg-white p-4 rounded-4 shadow-sm border mb-4">
            <h5 class="fw-bold mb-4">Step 1: Select Showtime</h5>
            <div class="d-flex flex-wrap gap-3" id="time-list">
                <button type="button" class="time-slot btn bg-white" onclick="selectTime(this)">10:30 AM</button>
                <button type="button" class="time-slot btn bg-white" onclick="selectTime(this)">01:45 PM</button>
                <button type="button" class="time-slot btn bg-white" onclick="selectTime(this)">05:00 PM</button>
                <button type="button" class="time-slot btn bg-white" onclick="selectTime(this)">09:30 PM</button>
            </div>
        </div>

        <div id="seat-selection-area" class="d-none">
            <div class="bg-white p-5 rounded-4 shadow-sm border text-center mb-5">
                <h5 class="fw-bold text-start mb-5">Step 2: Choose Your Seats</h5>
                <div class="screen mb-3"></div>
                <p class="text-muted mb-5 small">All eyes this way</p>
                
                <div class="d-flex flex-column align-items-center mb-4">
                    <div class="mb-2">
                        <button class="seat" aria-label="Seat"></button><button class="seat" aria-label="Seat"></button><button class="seat sold" disabled aria-label="Sold Seat"></button>
                        <button class="seat" aria-label="Seat"></button><button class="seat" aria-label="Seat"></button><button class="seat" aria-label="Seat"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="checkout-bar d-none" id="checkout-bar">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <p class="mb-0 text-muted small">Total Payable</p>
                <h3 class="fw-bold mb-0 text-danger" id="total-price">₹0</h3>
            </div>
            <button class="btn btn-danger btn-lg px-5 fw-bold rounded-3" onclick="alert('Booking Successful!')">Pay Now</button>
        </div>
    </div>

    <script>
        const movieDatabase = {
            'm1': { title: 'Sci-Fi Epic: Part Two', desc: 'A visually stunning journey through the cosmos and the human spirit.', img: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400&q=80', lang: 'English • 2D, 3D', price: 350 },
            'm2': { title: 'Laugh Riot 2026', desc: 'An evening of non-stop laughter with international touring comedians.', img: 'https://images.unsplash.com/photo-1585699324551-f6c309eedeca?w=400&q=80', lang: 'English/Hindi • Live', price: 500 },
            'm3': { title: 'The Great Heist', desc: 'A high-stakes thriller about a group of professionals planning the heist of a century.', img: 'https://images.unsplash.com/photo-1460881680858-30d872d5b530?w=400&q=80', lang: 'Hindi • 2D', price: 250 }
        };

        const params = new URLSearchParams(window.location.search);
        const movieId = params.get('id') || 'm1';
        const currentMovie = movieDatabase[movieId] || movieDatabase['m1'];

        document.getElementById('nav-movie-title').innerText = currentMovie.title;
        document.getElementById('movie-title').innerText = currentMovie.title;
        document.getElementById('movie-desc').innerText = currentMovie.desc;
        document.getElementById('movie-meta').innerText = currentMovie.lang;
        document.getElementById('movie-poster').src = currentMovie.img;

        function selectTime(el) {
            document.querySelectorAll('.time-slot').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('seat-selection-area').classList.remove('d-none');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        const seats = document.querySelectorAll('.seat:not(.sold)');
        seats.forEach(seat => {
            seat.addEventListener('click', () => {
                seat.classList.toggle('selected');
                const selectedCount = document.querySelectorAll('.seat.selected').length;
                document.getElementById('checkout-bar').classList.toggle('d-none', selectedCount === 0);
                document.getElementById('total-price').innerText = '₹' + (selectedCount * currentMovie.price);
            });
        });
    </script>
</body>
</html>
