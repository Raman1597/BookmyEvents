<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies & Events | BookMyEvents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <style>
        .movie-card { transition: 0.3s; border-radius: 12px; overflow: hidden; }
        .movie-card:hover { transform: scale(1.02); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .filter-section { border-radius: 15px; border: 1px solid #eee; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark py-3 mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="index.html">book<span class="text-danger">my</span>events</a>
            <div class="ms-auto d-flex gap-4">
                <a href="index.html" class="text-white text-decoration-none d-none d-md-block">Home</a>
                <a href="contact.html" class="text-white text-decoration-none d-none d-md-block">Contact</a>
                <a href="login.html" class="btn btn-danger btn-sm px-4 fw-bold">Sign In</a>
            </div>
        </div>
    </nav>
    
    <div class="container mb-5 flex-grow-1">
        <div class="row">
            <aside class="col-md-3 mb-4">
                <h4 class="fw-bold mb-3">Filters</h4>
                <div class="bg-white p-4 filter-section shadow-sm mb-3">
                    <h6 class="fw-bold text-danger mb-3">Languages</h6>
                    <div class="form-check mb-2">
                        <input type="checkbox" class="form-check-input" id="langEnglish"> 
                        <label class="form-check-label" for="langEnglish">English</label>
                    </div>
                    <div class="form-check mb-2">
                        <input type="checkbox" class="form-check-input" id="langHindi"> 
                        <label class="form-check-label" for="langHindi">Hindi</label>
                    </div>
                    <hr>
                    <h6 class="fw-bold text-danger mb-3">Genres</h6>
                    <div class="form-check mb-2">
                        <input type="checkbox" class="form-check-input" id="genreAction"> 
                        <label class="form-check-label" for="genreAction">Action</label>
                    </div>
                    <div class="form-check mb-2">
                        <input type="checkbox" class="form-check-input" id="genreComedy"> 
                        <label class="form-check-label" for="genreComedy">Comedy</label>
                    </div>
                </div>
            </aside>

            <main class="col-md-9">
                <h4 class="fw-bold mb-3">Movies in Delhi-NCR</h4>
                <div class="row g-4">
                    <div class="col-6 col-md-4">
                        <a href="details.html?id=m1" class="text-decoration-none text-dark">
                            <div class="card border-0 movie-card shadow-sm h-100">
                                <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400&q=80" class="card-img-top" alt="Sci-Fi Epic" />
                                <div class="card-body">
                                    <h5 class="card-title fw-bold mb-1">Sci-Fi Epic</h5>
                                    <p class="card-text text-muted mb-0"><small>English • 2D, 3D</small></p>
                                </div>
                            </div>
                        </a>
                    </div>
                    <div class="col-6 col-md-4">
                        <a href="details.html?id=m3" class="text-decoration-none text-dark">
                            <div class="card border-0 movie-card shadow-sm h-100">
                                <img src="https://images.unsplash.com/photo-1460881680858-30d872d5b530?w=400&q=80" class="card-img-top" alt="The Great Heist" />
                                <div class="card-body">
                                    <h5 class="card-title fw-bold mb-1">The Great Heist</h5>
                                    <p class="card-text text-muted mb-0"><small>Hindi • 2D</small></p>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <p class="mb-0 text-light small">Designed by Raman Bansal | &copy; 2026 BookMyEvents</p>
    </footer>
</body>
</html>
