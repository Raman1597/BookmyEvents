<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | BookMyEvents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-bms-dark navbar-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="index.html">book<span class="text-danger">my</span>events</a>
            <div class="ms-auto d-flex gap-4">
                <a href="index.html" class="text-white text-decoration-none">Home</a>
                <a href="events.html" class="text-white text-decoration-none">Movies</a>
            </div>
        </div>
    </nav>
    
    <div class="container my-5 flex-grow-1">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Contact Our Support Team</h1>
            <p class="text-muted fs-5">We're here to help you with your bookings and queries.</p>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="card p-5 text-center shadow-sm contact-card h-100">
                    <i class="fa-solid fa-envelope contact-icon"></i>
                    <h5 class="fw-bold">Email Support</h5>
                    <p class="text-muted">help@bookmyevents.com</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-5 text-center shadow-sm contact-card h-100">
                    <i class="fa-solid fa-phone-volume contact-icon"></i>
                    <h5 class="fw-bold">Call Center</h5>
                    <p class="text-muted">+91 1800-444-555</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-5 text-center shadow-sm contact-card h-100">
                    <i class="fa-solid fa-map-location-dot contact-icon"></i>
                    <h5 class="fw-bold">Headquarters</h5>
                    <p class="text-muted">Sonipat, Haryana, India</p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card border-0 shadow-lg p-5 rounded-4">
                    <h3 class="fw-bold mb-4">Send us a message</h3>
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="fullName" class="form-label fw-bold">Full Name</label>
                                <input type="text" id="fullName" class="form-control p-2">
                            </div>
                            <div class="col-md-6">
                                <label for="contactEmail" class="form-label fw-bold">Email Address</label>
                                <input type="email" id="contactEmail" class="form-control p-2">
                            </div>
                            <div class="col-12">
                                <label for="message" class="form-label fw-bold">Message</label>
                                <textarea id="message" class="form-control" rows="5"></textarea>
                            </div>
                            <div class="col-12">
                                <button type="button" class="btn btn-danger w-100 py-3 fw-bold" onclick="alert('Message Sent Successfully!')">Send Message</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <p class="mb-0 text-light small">Designed by Raman Bansal | &copy; 2026 BookMyEvents</p>
    </footer>
</body>
</html>
