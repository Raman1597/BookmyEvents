<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BookMyEvents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .login-side-bg { background: linear-gradient(rgba(51, 53, 69, 0.9), rgba(51, 53, 69, 0.9)), url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=800&q=80') center/cover; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div class="container-fluid p-0 flex-grow-1">
        <div class="row g-0 h-100 min-vh-100">
            <div class="col-lg-6 d-none d-lg-flex login-side-bg align-items-center justify-content-center text-white p-5">
                <div class="text-center">
                    <h1 class="display-3 fw-bold">book<span class="text-danger">my</span>events</h1>
                    <p class="fs-4 opacity-75">Your gateway to the best movies and live shows.</p>
                </div>
            </div>

            <div class="col-lg-6 d-flex align-items-center justify-content-center bg-white">
                <div class="p-4 p-md-5 w-100" style="max-width: 500px;">
                    <div class="text-center mb-5 d-lg-none">
                        <h2 class="fw-bold">book<span class="text-danger">my</span>events</h2>
                    </div>
                    
                    <h3 class="fw-bold mb-4">Welcome Back</h3>
                    
                    <div class="d-grid gap-3 mb-4">
                        <button class="btn btn-outline-dark py-2 fw-semibold">
                            <img src="https://www.google.com/favicon.ico" alt="Google" class="me-2" width="18"> Continue with Google
                        </button>
                        <button class="btn btn-outline-dark py-2 fw-semibold">
                            <i class="fa-brands fa-apple me-2 fs-5"></i> Continue with Apple
                        </button>
                    </div>

                    <div class="d-flex align-items-center mb-4">
                        <hr class="flex-grow-1">
                        <span class="mx-3 text-muted small">OR CONTINUE WITH EMAIL</span>
                        <hr class="flex-grow-1">
                    </div>

                    <form action="index.html">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold small">Email Address</label>
                            <input type="email" class="form-control p-3" id="email" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-4">
                            <div class="d-flex justify-content-between">
                                <label for="pass" class="form-label fw-bold small">Password</label>
                                <a href="#" class="text-danger text-decoration-none small">Forgot?</a>
                            </div>
                            <input type="password" class="form-control p-3" id="pass" placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 py-3 fw-bold shadow-sm">Sign In</button>
                    </form>

                    <p class="text-center mt-4 text-muted small">
                        Don't have an account? <a href="#" class="text-danger fw-bold text-decoration-none">Sign Up</a>
                    </p>
                    <div class="text-center">
                        <a href="index.html" class="text-decoration-none text-muted small"><i class="fa-solid fa-arrow-left me-1"></i> Skip for now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <p class="mb-0 text-light small">Designed by Raman Bansal | &copy; 2026 BookMyEvents</p>
    </footer>
</body>
</html>
